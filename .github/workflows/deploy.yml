name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20. vitest 4 pulls esbuild 0.28.x, and npm 10 (which ships with Node 20)
          # resolves that differently from npm 11 — `npm ci` failed there with
          # "Missing: esbuild@0.28.2 from lock file" while succeeding locally. The toolchain
          # moved on; CI had not.
          node-version: 22
          cache: npm

      - run: npm ci
      # Unit tests for the two markdown plugins. They were verified once by hand when written
      # and by nothing afterwards, which is how the heading rule nearly shipped as a blind
      # one-level demotion.
      - run: npm test
      - run: npm run build

      # The audit runs inside postbuild too, but WITHOUT --strict, so it reports and exits 0.
      # That is deliberate: content arrives here automatically from the Medium/Site-1 sync, and
      # a synced article must never be able to block a deploy — a stale live site is worse than
      # an SEO warning. But a check that cannot fail is easy to stop reading, so run the strict
      # pass here as well and put the result in the job summary, where it is visible without
      # gating anything.
      - name: SEO/a11y audit (reported, non-blocking)
        continue-on-error: true
        run: |
          echo '### dist audit' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if npm run --silent audit >> "$GITHUB_STEP_SUMMARY" 2>&1; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '✅ no errors' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '⚠️ **errors found — deploy continued, but fix these**' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages (build type = GitHub Actions) on first run,
          # so no manual Settings → Pages step is required.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
